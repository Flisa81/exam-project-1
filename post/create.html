<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Post | Felicia’s Needle & Thread</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header>
    <div class="header-wrapper">
      <a href="../index.html" class="logo-link" aria-label="Felicia’s Needle & Thread home">
        <img src="../assets/logo/Logo.png" alt="Felicia’s Needle & Thread Logo" class="logo" />
      </a>

      <a href="../index.html" class="site-title">Felicia’s Needle & Thread</a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <span id="user-greeting"></span>
        <a href="../account/login.html" id="login-link">Login</a>
        <a href="../post/create.html" id="create-post-link" style="display: none;">Create Post</a>
        <a href="../feed.html" id="feed-link" style="display: none;">Feed</a>
        <a href="#" id="logout-link" style="display: none;">Logout</a>
      </nav>
    </div>
  </header>

  <main class="form-page">
    <h2>Create a New Blog Post</h2>

    <form id="create-post-form">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required />

      <label for="body">Body</label>
      <textarea id="body" name="body" rows="6" required>🧵 Today I worked on a new project...
✨ Materials used:
🧷 Techniques:
📸 Final thoughts:</textarea>

      <label for="media">Image URL</label>
      <input type="url" id="media" name="media" placeholder="https://example.com/image.jpg" />

      <label for="media-select">Or select an image</label>
      <select id="media-select">
        <option value="">-- Select an image --</option>
        <option value="https://i.imgur.com/3dPPZNu.jpeg" data-alt="Fabric swatches">Fabric swatches</option>
        <option value="https://i.imgur.com/ioBYGCu.jpeg" data-alt="Thread collection">Thread collection</option>
        <option value="https://i.imgur.com/Uzn8cNY.jpeg" data-alt="Vintage sewing machine">Vintage sewing machine</option>
        <option value="https://i.imgur.com/igxY1Hm.jpeg" data-alt="Colorful fabrics">Colorful fabrics</option>
        <option value="https://i.imgur.com/kDEsiOg.jpeg" data-alt="Spools and needles">Spools and needles</option>
        <option value="https://i.imgur.com/ROfvfTA.jpeg" data-alt="Sewing tools close-up">Sewing tools close-up</option>
        <option value="https://i.imgur.com/wamD4wa.jpeg" data-alt="Fabric and scissors">Fabric and scissors</option>
        <option value="https://i.imgur.com/Ml6ryJy.jpeg" data-alt="Modern sewing room">Modern sewing room</option>
        <option value="https://i.imgur.com/Ymp0DI2.jpeg" data-alt="Needle and thread">Needle and thread</option>
        <option value="https://i.imgur.com/3SIb5xJ.jpeg" data-alt="Craft project in progress">Craft project in progress</option>
        <option value="https://i.imgur.com/caPFSJz.jpeg" data-alt="Sewing accessories">Sewing accessories</option>
        <option value="https://i.imgur.com/tFgXAeG.jpeg" data-alt="Handmade garments">Handmade garments</option>
        <option value="https://i.imgur.com/Nf7zcrj.jpeg" data-alt="Seamstress workspace">Seamstress workspace</option>
      </select>

      <img id="media-preview" src="" alt="Media Preview" />
      <p class="message" id="form-message"></p>
      <button type="submit">Publish</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Felicia’s Needle & Thread | Handmade with love & stitches</p>
  </footer>

  <script src="../js/create.js"></script>
  <script src="../js/auth-ui.js"></script>
</body>
</html>
